<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta name="theme-color" content="#fafaf9" />
    <title>Role Lens · Your positions</title>
    <link rel="stylesheet" href="/style.css" />
  </head>
  <body>
    <header class="appheader">
      <a class="brand" href="#">Role Lens</a>
      <nav class="mainnav" aria-label="Main navigation">
        <button data-page="positions" class="active">Positions</button
        ><button data-page="candidates">Candidates</button
        ><button data-page="templates">Templates</button
        ><button data-page="insights">Insights</button>
      </nav>
      <div class="headeractions">
        <button
          class="headersearch"
          data-action="home"
          aria-label="Find a position"
        >
          <svg
            width="18"
            height="18"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="1.6"
          >
            <circle cx="10" cy="10" r="6" />
            <path d="m15 15 5 5" />
          </svg></button
        ><button id="notificationButton" aria-label="Notifications">
          <svg
            width="18"
            height="18"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="1.6"
            aria-hidden="true"
          >
            <path
              d="M18 8a6 6 0 0 0-12 0c0 7-3 7-3 9h18c0-2-3-2-3-9M10 21h4"
            /></svg
          ><span id="notificationCount">0</span></button
        ><span class="workspaceavatar" title="Local workspace">RL</span>
      </div>
    </header>
    <main>
      <div id="status" role="status">Loading your workspace…</div>
      <div id="main"></div>
    </main>
    <dialog id="detail">
      <button class="close" aria-label="Close details">✕</button>
      <div id="detailBody"></div>
    </dialog>
    <dialog id="uploadDialog">
      <button class="close" aria-label="Close upload">✕</button>
      <div id="uploadBody"></div>
    </dialog>
    <dialog id="notifications">
      <button class="close" aria-label="Close notifications">✕</button>
      <h2>Notifications</h2>
      <p class="subtle">
        Completion and failure notices for your uploads. The latest 100 are kept
        in this browser.
      </p>
      <button id="clearNotifications">Clear notifications</button>
      <div id="notificationList"></div>
    </dialog>
    <div
      id="announcements"
      role="status"
      aria-live="polite"
      class="sr-only"
    ></div>
    <div id="toast" role="status" hidden></div>
    <script type="module" src="/app.js"></script>
  </body>
</html>
